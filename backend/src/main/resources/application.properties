spring.application.name=datasifter
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
datasifter.security.admin.username=${DATASIFTER_SECURITY_ADMIN_USERNAME:}
datasifter.security.admin.password=${DATASIFTER_SECURITY_ADMIN_PASSWORD:}
datasifter.security.operator.username=${DATASIFTER_SECURITY_OPERATOR_USERNAME:}
datasifter.security.operator.password=${DATASIFTER_SECURITY_OPERATOR_PASSWORD:}
datasifter.security.auditor.username=${DATASIFTER_SECURITY_AUDITOR_USERNAME:}
datasifter.security.auditor.password=${DATASIFTER_SECURITY_AUDITOR_PASSWORD:}
datasifter.security.viewer.username=${DATASIFTER_SECURITY_VIEWER_USERNAME:}
datasifter.security.viewer.password=${DATASIFTER_SECURITY_VIEWER_PASSWORD:}
datasifter.vault.passphrase=${DATASIFTER_VAULT_PASSPHRASE:}
datasifter.vault.provider=${DATASIFTER_VAULT_PROVIDER:local}
datasifter.vault.require-managed-provider=${DATASIFTER_VAULT_REQUIRE_MANAGED_PROVIDER:false}
datasifter.worker.enabled=${DATASIFTER_WORKER_ENABLED:false}
datasifter.worker.id=${DATASIFTER_WORKER_ID:embedded-worker}
datasifter.worker.poll-interval=${DATASIFTER_WORKER_POLL_INTERVAL:1000}
datasifter.storage.local-directory=${DATASIFTER_STORAGE_LOCAL_DIRECTORY:}
datasifter.storage.provider=${DATASIFTER_STORAGE_PROVIDER:local}
datasifter.storage.require-distributed-provider=${DATASIFTER_STORAGE_REQUIRE_DISTRIBUTED_PROVIDER:false}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
