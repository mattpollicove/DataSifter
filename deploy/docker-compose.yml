services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: datasifter
      MYSQL_USER: ${DATASIFTER_DB_USERNAME:?Set DATASIFTER_DB_USERNAME}
      MYSQL_PASSWORD: ${DATASIFTER_DB_PASSWORD:?Set DATASIFTER_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATASIFTER_DB_ROOT_PASSWORD:?Set DATASIFTER_DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-environment
      DATASIFTER_DB_URL: jdbc:mysql://db:3306/datasifter?serverTimezone=UTC
      DATASIFTER_DB_USERNAME: ${DATASIFTER_DB_USERNAME:?Set DATASIFTER_DB_USERNAME}
      DATASIFTER_DB_PASSWORD: ${DATASIFTER_DB_PASSWORD:?Set DATASIFTER_DB_PASSWORD}
      DATASIFTER_SECURITY_ADMIN_USERNAME: ${DATASIFTER_SECURITY_ADMIN_USERNAME:?Set DATASIFTER_SECURITY_ADMIN_USERNAME}
      DATASIFTER_SECURITY_ADMIN_PASSWORD: ${DATASIFTER_SECURITY_ADMIN_PASSWORD:?Set DATASIFTER_SECURITY_ADMIN_PASSWORD}
      DATASIFTER_VAULT_PROVIDER: hashicorp-vault-transit
      DATASIFTER_VAULT_REQUIRE_MANAGED_PROVIDER: "true"
      DATASIFTER_VAULT_TRANSIT_ADDRESS: ${DATASIFTER_VAULT_TRANSIT_ADDRESS:?Set DATASIFTER_VAULT_TRANSIT_ADDRESS}
      DATASIFTER_VAULT_TRANSIT_MOUNT: ${DATASIFTER_VAULT_TRANSIT_MOUNT:-transit}
      DATASIFTER_VAULT_TRANSIT_KEY: ${DATASIFTER_VAULT_TRANSIT_KEY:?Set DATASIFTER_VAULT_TRANSIT_KEY}
      DATASIFTER_VAULT_TRANSIT_TOKEN_FILE: /run/secrets/vault-transit-token
      DATASIFTER_STORAGE_PROVIDER: s3-compatible
      DATASIFTER_STORAGE_REQUIRE_DISTRIBUTED_PROVIDER: "true"
      DATASIFTER_STORAGE_S3_ENDPOINT: ${DATASIFTER_STORAGE_S3_ENDPOINT:?Set DATASIFTER_STORAGE_S3_ENDPOINT}
      DATASIFTER_STORAGE_S3_REGION: ${DATASIFTER_STORAGE_S3_REGION:-us-east-1}
      DATASIFTER_STORAGE_S3_BUCKET: ${DATASIFTER_STORAGE_S3_BUCKET:?Set DATASIFTER_STORAGE_S3_BUCKET}
      DATASIFTER_STORAGE_S3_ACCESS_KEY_FILE: /run/secrets/s3-access-key
      DATASIFTER_STORAGE_S3_SECRET_KEY_FILE: /run/secrets/s3-secret-key
      DATASIFTER_VAULT_PASSPHRASE: ${DATASIFTER_VAULT_PASSPHRASE:-}
      DATASIFTER_WORKER_TOKEN: ${DATASIFTER_WORKER_TOKEN:?Set DATASIFTER_WORKER_TOKEN}
      DATASIFTER_DATA_DIRECTORY: /var/lib/datasifter
      DATASIFTER_STORAGE_LOCAL_DIRECTORY: /var/lib/datasifter
      DATASIFTER_WORKER_ENABLED: "false"
    volumes:
      - datasifter-state:/var/lib/datasifter
      - ${DATASIFTER_PLUGIN_DIRECTORY:-./plugins}:/opt/datasifter/plugins:ro
    secrets:
      - vault-transit-token
      - s3-access-key
      - s3-secret-key
    expose:
      - "8080"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["--server.port=-1"]
    environment:
      <<: *app-environment
      DATASIFTER_WORKER_ENABLED: "true"
      DATASIFTER_WORKER_ID: worker
    volumes:
      - datasifter-state:/var/lib/datasifter
      - ${DATASIFTER_PLUGIN_DIRECTORY:-./plugins}:/opt/datasifter/plugins:ro
    secrets:
      - vault-transit-token
      - s3-access-key
      - s3-secret-key

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"

  https-proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    environment:
      DATASIFTER_DOMAIN: ${DATASIFTER_DOMAIN:?Set DATASIFTER_DOMAIN to a public DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  datasifter-state:
  caddy-data:
  caddy-config:

secrets:
  vault-transit-token:
    file: ${DATASIFTER_VAULT_TRANSIT_TOKEN_SECRET_FILE:?Set DATASIFTER_VAULT_TRANSIT_TOKEN_SECRET_FILE}
  s3-access-key:
    file: ${DATASIFTER_STORAGE_S3_ACCESS_KEY_SECRET_FILE:?Set DATASIFTER_STORAGE_S3_ACCESS_KEY_SECRET_FILE}
  s3-secret-key:
    file: ${DATASIFTER_STORAGE_S3_SECRET_KEY_SECRET_FILE:?Set DATASIFTER_STORAGE_S3_SECRET_KEY_SECRET_FILE}
