name: CI and release validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend
        run: mvn -B -f backend/pom.xml clean verify
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container-build:
    name: Validate container packaging
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate container deployment configuration
        run: |
          mkdir -p deploy/secrets
          trap 'rm -f deploy/secrets/vault-transit-token deploy/secrets/s3-access-key deploy/secrets/s3-secret-key' EXIT
          printf 'ci-placeholder' > deploy/secrets/vault-transit-token
          printf 'ci-placeholder' > deploy/secrets/s3-access-key
          printf 'ci-placeholder' > deploy/secrets/s3-secret-key
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
      - name: Build backend container
        run: docker build -t datasifter/backend:ci -f backend/Dockerfile backend
      - name: Build frontend container
        run: docker build -t datasifter/frontend:ci -f frontend/Dockerfile frontend

  mysql-smoke:
    name: Verify MySQL migrations and API startup
    needs: validate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: datasifter
          MYSQL_USER: datasifter
          MYSQL_PASSWORD: ci-db-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package backend
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Start API and verify MySQL schema
        env:
          DATASIFTER_DB_URL: jdbc:mysql://127.0.0.1:3306/datasifter?serverTimezone=UTC
          DATASIFTER_DB_USERNAME: datasifter
          DATASIFTER_DB_PASSWORD: ci-db-password
          DATASIFTER_SECURITY_ADMIN_USERNAME: ci-admin
          DATASIFTER_SECURITY_ADMIN_PASSWORD: ci-phase-one-admin-password
          DATASIFTER_VAULT_PASSPHRASE: ci-phase-one-vault-passphrase
          DATASIFTER_DATA_DIRECTORY: ${{ runner.temp }}/datasifter-phase1
        run: |
          java -jar backend/target/datasifter-backend-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/datasifter-mysql-smoke.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/datasifter-mysql-smoke.log"
            exit 1
          fi
          test "$(MYSQL_PWD=ci-db-password mysql --host=127.0.0.1 --user=datasifter datasifter --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'datasifter' AND table_name IN ('workflows', 'connectors', 'job_executions', 'audit_entries', 'key_vault_secrets', 'datasifter_metadata', 'flyway_schema_history')")" = "7"
          curl --fail --silent --show-error --user ci-admin:ci-phase-one-admin-password http://127.0.0.1:8080/api/session

  release-artifacts:
    name: Assemble release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, container-build, mysql-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Package backend
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: datasifter-${{ github.ref_name }}
          path: |
            backend/target/datasifter-backend-*.jar
            frontend/dist/**
